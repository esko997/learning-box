<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#253c68">
  <title>Your game</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="game-player.css">
</head>
<body data-theme="sky">
  <header class="topbar">
    <a id="library-link" href="game-creator.html">My games</a>
    <span id="env-badge" class="env-badge" hidden></span>
    <span id="preview-label" hidden>Game preview</span>
  </header>
  <main>
    <h1 id="title">Your game</h1>
    <p id="loading" role="status">Loading your game…</p>
    <section id="error-panel" role="alert" hidden>
      <h2>We couldn't open this game</h2>
      <p id="error-message"></p>
      <button id="retry" type="button">Try again</button>
    </section>
    <section id="game" hidden>
      <p id="instructions"></p>
      <div id="rival-picker" hidden>
        <label for="rival-choice">Choose your rival</label>
        <select id="rival-choice"></select>
        <p class="hint">Choose before starting or after the battle. Every character is available.</p>
      </div>
      <div class="actions">
        <button id="start" class="primary" type="button">Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="raise" type="button" hidden>Add a row</button>
        <button id="rules-toggle" type="button" aria-expanded="false" aria-controls="rules">How to play</button>
      </div>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p id="result"></p>
      <section id="rules" hidden><h2>How to play</h2><p id="rules-text"></p></section>
      <section id="flyer" hidden>
        <div class="flight-stats"><span id="hearts"></span><span>Score: <strong id="score">0</strong></span></div>
        <div class="sky-wrap">
          <canvas id="sky" width="960" height="540" tabindex="0" role="img" aria-label="Your flying game" aria-describedby="instructions rules-text">This game needs canvas support.</canvas>
          <div id="flight-overlay"><strong id="overlay-title"></strong><span id="overlay-detail"></span></div>
        </div>
        <details id="roster-details"><summary>Meet the flyers</summary><ul id="roster"></ul></details>
      </section>
      <section id="puzzle" hidden aria-label="Puzzle battle">
        <div class="arena">
          <section class="well" id="player-well">
            <header class="actor"><img id="player-art" alt=""><div><h2 id="player-name"></h2><span>You</span></div></header>
            <p class="board-score" id="player-score"></p>
            <p class="board-message" id="player-message"></p>
            <p class="danger-message" id="player-danger"></p>
            <div id="player-board" class="board" tabindex="0" role="group" aria-label="Your puzzle board" aria-describedby="rules-text"></div>
            <div id="player-next" class="next-row" aria-hidden="true"></div>
            <span class="hint">Next row</span>
          </section>
          <section class="well" id="rival-well">
            <header class="actor"><img id="rival-art" alt=""><div><h2 id="rival-name"></h2><span>Computer</span></div></header>
            <p class="board-score" id="rival-score"></p>
            <p class="board-message" id="rival-message"></p>
            <p class="danger-message" id="rival-danger"></p>
            <div id="rival-board" class="board" role="img" aria-label="Rival's puzzle board"></div>
            <div id="rival-next" class="next-row" aria-hidden="true"></div>
            <span class="hint">Next row</span>
          </section>
        </div>
      </section>
    </section>
    <noscript><p>Turn on JavaScript to play your game.</p></noscript>
  </main>
  <script type="module" src="game-player.js"></script>
</body>
</html>
